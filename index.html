<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jejak · sampai mana sih aku?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090a; --panel:#111113; --panel2:#18181b; --line:#222226; --line2:#303036;
  --ink:#ececee; --muted:#8b8c94; --dim:#5a5b62;
  --accent:#ff7a45; --ok:#3ecf8e; --bad:#ff5a52; --warn:#f0b429;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(900px 420px at 12% -8%, #1a1b20 0%, transparent 62%),
    radial-gradient(700px 380px at 100% 0%, #1b1410 0%, transparent 60%),
    var(--bg);
  min-height:100vh;
}
.wrap{max-width:1280px;margin:0 auto;padding:22px 22px 70px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.brand h1 i{display:inline-block;width:11px;height:11px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.brand p{margin:0;color:var(--muted);font-size:13px}
.seg2{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg2 button{border:0;background:none;color:var(--muted);padding:6px 13px;border-radius:7px;cursor:pointer;font-weight:500}
.seg2 button:hover{color:var(--ink)}
.seg2 button.on{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset}
.btn{border:1px solid var(--line2);background:var(--panel);padding:7px 13px;border-radius:9px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--panel2)}
.btn.pri{background:var(--ink);color:#0b0b0c;border-color:var(--ink);font-weight:600}
.btn.pri:hover{background:#fff}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--panel)}
.btn.danger{color:var(--bad)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:linear-gradient(180deg,var(--panel),#0e0e10);border:1px solid var(--line);border-radius:12px;padding:11px 14px}
.stat b{display:block;font:500 24px/1.1 var(--mono);letter-spacing:-.03em}
.stat span{color:var(--muted);font-size:12.5px}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#1a1510;border:1px solid #3a2b1c;color:#e9c9a6;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
.bar label{color:var(--muted);font-size:13px;display:inline-flex;align-items:center;gap:6px}
select,input[type=text],input[type=date]{
  background:var(--panel2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
select:hover,input:hover{border-color:#3d3d45}

/* ===== roadmap ===== */
.tl{position:relative;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:rgba(13,13,15,.7);max-height:calc(100vh - 290px);min-height:200px}
.tlin{position:relative}
.hdr{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0f0f11,#0c0c0e);border-bottom:1px solid var(--line2)}
.hm,.hw,.hd{position:relative}
.hm{height:30px}
.hw{height:26px;background-repeat:repeat-x;background-position:left bottom}
.hd{height:12px}
.ml{position:absolute;top:0;bottom:0;border-left:1px dashed #3a3a42;padding:7px 0 0 0;font:500 12px/1 var(--mono);letter-spacing:.08em;color:#b9bac2;white-space:nowrap}
.ml span{position:sticky;left:9px;padding-right:6px}
.wl{position:absolute;top:4px;font:400 12px/1 var(--mono);color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.dn{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) var(--p,0%),transparent)}
.dn i{position:absolute;right:0;left:0;top:-1px;text-align:center;font:700 9px/12px var(--mono);color:var(--bad);font-style:normal}
.body{position:relative}
.ovl{position:absolute;inset:0;pointer-events:none;z-index:0}
.gl{position:absolute;top:0;bottom:0;border-left:1px solid #17171a}
.gl.m{border-left:1px dashed #2b2b31}
.wk{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.012)}
.todayl{position:absolute;top:0;bottom:0;width:0;border-left:1.5px solid var(--accent);z-index:12;pointer-events:none;filter:drop-shadow(0 0 5px rgba(255,122,69,.5))}
.hdr .todayl::before{content:"";position:absolute;top:-1px;left:-5px;width:8.5px;height:8.5px;background:var(--accent);transform:rotate(45deg) scale(.85)}
.prow{position:relative;height:124px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.ptrack{position:absolute;top:9px;height:26px}
.pname{position:sticky;left:16px;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;z-index:13}
.pname .ico{width:9px;height:9px;border-radius:2px;background:var(--c);transform:rotate(45deg);flex:none}
.pname .nm{flex:none;font-weight:600;font-size:15px;letter-spacing:-.01em;cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.pname .nm:hover{text-decoration:underline;text-decoration-color:var(--dim)}
.pname .meta{font:400 11.5px var(--mono);color:var(--muted)}
.pname.fin .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--dim)}
.pname.fin .meta{color:var(--dim)}
.pill{font:500 11px/1 var(--mono);padding:3px 7px;border-radius:99px;border:1px solid}
.pill.bad{color:var(--bad);border-color:#5a2724;background:#2a1413}
.pill.warn{color:var(--warn);border-color:#4f3d12;background:#231b09}
.pill.ok{color:var(--ok);border-color:#1a4a35;background:#0e2119}
.go{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;width:24px;height:24px;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);padding:0}
.go:hover{color:#0b0b0c;background:var(--c);border-color:var(--c)}
.pbar{position:absolute;top:42px;height:34px;border:1px solid var(--line2);border-radius:7px;background:#151518;cursor:pointer}
.pbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,transparent),color-mix(in srgb,var(--c) 42%,transparent));border-right:2px solid var(--c)}
.pbar.fin .fill{border-radius:6px;border-right:0;background:color-mix(in srgb,var(--c) 20%,transparent)}
.pbar:hover{border-color:#44444d}
.over{position:absolute;top:42px;height:34px;border:1px dashed var(--bad);border-left:0;border-radius:0 7px 7px 0;background:repeating-linear-gradient(135deg,rgba(255,90,82,.22) 0 6px,rgba(255,90,82,.07) 6px 12px);z-index:2;pointer-events:none}
.ms{position:absolute;top:59px;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;transform:rotate(45deg);border-radius:2px;border:1.5px solid var(--dim);background:#151518;z-index:3;cursor:pointer}
.ms.done{background:var(--c);border-color:var(--c)}
.ms.cur{border-color:var(--c);background:#151518;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 28%,transparent)}
.ms.cur.late{border-color:var(--bad);box-shadow:0 0 0 3px rgba(255,90,82,.25)}
.lb{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;transform:translateX(-50%);z-index:3;pointer-events:none}
.lb.done{text-decoration:line-through;color:var(--dim)}
.lb.cur{color:var(--ink);font-weight:600}
.lb.cur.late{color:var(--bad)}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:12px;align-items:center}
.legend span{display:inline-flex;gap:7px;align-items:center}
.lg-d{width:9px;height:9px;transform:rotate(45deg);border-radius:2px;border:1.5px solid var(--dim);display:inline-block}
.lg-d.f{background:var(--dim)} .lg-d.c{border-color:var(--ink)} .lg-d.r{border-color:var(--bad)}
.lg-l{width:22px;height:10px;border:1px dashed var(--bad);border-radius:3px;display:inline-block;background:rgba(255,90,82,.15)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:42px 20px;text-align:center;color:var(--muted)}

/* ===== daftar ===== */
.cards{display:grid;grid-template-columns:1fr;gap:14px}
.card{--c:var(--accent);position:relative;background:linear-gradient(180deg,var(--panel),#0e0e10);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 14px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--c)}
.card.fin{opacity:.72}
.chead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.chead h3{margin:0;font-size:17px;font-weight:650;letter-spacing:-.015em;cursor:pointer}
.card.fin h3{text-decoration:line-through;color:var(--muted)}
.csub{color:var(--muted);font:400 12px var(--mono);margin-top:3px}
.cnt{font:500 20px/1 var(--mono);letter-spacing:-.04em;text-align:right}
.cnt small{display:block;color:var(--muted);font-size:11px;letter-spacing:0;margin-top:3px}
.prog{height:3px;background:var(--line);border-radius:3px;margin:13px 0 4px;overflow:hidden}
.prog div{height:100%;background:var(--c);border-radius:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px;min-height:20px}
.steps{list-style:none;margin:14px 0 6px;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(70px,1fr);overflow-x:auto}
.step{position:relative;text-align:center;cursor:pointer;padding:0 4px 4px}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--line2)}
.step:first-child::before{display:none}
.step.done::before,.step.cur::before{background:var(--c)}
.dot{position:relative;z-index:1;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--panel2);border:2px solid var(--line2);font:500 11px var(--mono);color:var(--muted)}
.step.done .dot{background:var(--c);border-color:var(--c);color:#0b0b0c}
.step.cur .dot{border-color:var(--c);color:var(--ink);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.step.cur.late .dot{border-color:var(--bad);box-shadow:0 0 0 4px rgba(255,90,82,.22)}
.sname{display:block;margin-top:7px;font-size:12px;line-height:1.25;color:var(--muted)}
.step.done .sname{text-decoration:line-through;color:var(--dim)}
.step.cur .sname{color:var(--ink);font-weight:600}
.sdue{display:block;font:400 10.5px var(--mono);color:var(--dim);margin-top:2px}
.now{margin:10px 0 0;font-size:13px;color:var(--muted)}
.now b{color:var(--ink);font-weight:600}
.note{width:100%;margin-top:11px}
.cfoot{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.cfoot .sp{flex:1}
.gobtn{background:var(--c);color:#0b0b0c;border:0;font-weight:650;padding:7px 14px;border-radius:9px;cursor:pointer}
.gobtn:hover{filter:brightness(1.1)}
details{margin-top:10px;color:var(--muted);font-size:12.5px}
summary{cursor:pointer;color:var(--muted)}
details ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:3px;font-family:var(--mono);font-size:11.5px}
details li span{color:var(--dim);margin-right:8px}

/* ===== tugas ===== */
.tnav{display:inline-flex;align-items:center;gap:6px}
.tnav .tl2{min-width:190px;text-align:center;font-weight:600;letter-spacing:-.01em}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:12px;align-items:start}
.days.one{grid-template-columns:minmax(0,1fr);max-width:720px}
.dcard{position:relative;background:linear-gradient(180deg,var(--panel),#0e0e10);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 10px;overflow:hidden}
.dcard.today{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dcard.today::before,.dcard.late::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.dcard.late{border-color:#5a2724;margin-bottom:12px}
.dcard.late::before{background:var(--bad)}
.dcard.empty2{opacity:.6;padding-bottom:12px}
.dcard.empty2.today{opacity:1}
.dh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.dh h3{margin:0;font-size:16px;font-weight:650;letter-spacing:-.015em}
.dh h3 small{margin-left:8px;color:var(--muted);font:400 12px var(--mono);letter-spacing:0}
.dh .dc{font:500 11.5px var(--mono);color:var(--muted)}
.dcard.late .dh h3{color:var(--bad)}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.task{display:flex;align-items:flex-start;gap:10px;padding:8px 6px;border-radius:9px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task:hover{background:rgba(255,255,255,.025)}
.chk{flex:none;width:20px;height:20px;margin-top:1px;border-radius:6px;border:2px solid var(--c);background:none;display:inline-grid;place-items:center;cursor:pointer;color:transparent;padding:0}
.chk:hover{background:color-mix(in srgb,var(--c) 30%,transparent);color:var(--ink)}
.chk.off{border-color:var(--line2);border-style:dashed;cursor:not-allowed}
.chk.off:hover{background:none;color:transparent}
.tb{flex:1;min-width:0;cursor:pointer}
.tn{display:block;font-weight:550;font-size:14px;line-height:1.3}
.tp{display:flex;align-items:center;flex-wrap:wrap;gap:3px 8px;margin-top:3px;color:var(--muted);font-size:12px}
.tp b{display:inline-flex;align-items:center;gap:6px;font-weight:400}
.tp i{width:7px;height:7px;border-radius:2px;background:var(--c);transform:rotate(45deg);flex:none}
.tp em{font:400 11px var(--mono);color:var(--dim);font-style:normal}
.tp .pill{font-size:10.5px;padding:2px 6px}
.tnone{color:var(--dim);font-size:12.5px;padding:6px 6px 4px}

/* ===== dialog ===== */
dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line2);border-radius:18px;padding:0;width:min(680px,94vw);max-height:92vh;box-shadow:0 30px 80px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.62);backdrop-filter:blur(3px)}
dialog form{padding:22px;display:grid;gap:14px}
dialog h2{margin:0;font-size:19px;letter-spacing:-.02em}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:grid;gap:5px;font-size:12.5px;color:var(--muted)}
.fl input,.fl select{width:100%;font-size:14px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw label{cursor:pointer}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw span{display:block;width:24px;height:24px;border-radius:7px;background:var(--c);border:2px solid transparent;transform:rotate(45deg) scale(.78);transition:transform .12s}
.sw input:checked+span{border-color:#fff;transform:rotate(45deg) scale(.95)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:3px}
.sh{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:12.5px}
.srows{display:grid;gap:7px;max-height:300px;overflow:auto;padding-right:2px}
.srow{display:grid;grid-template-columns:78px 1fr 142px 28px 28px 28px;gap:7px;align-items:center}
.srow .ck{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.srow .ck:has(input:checked){color:var(--ink)}
input.bad{border-color:var(--bad)!important;box-shadow:0 0 0 3px rgba(255,90,82,.18)}
.warnbox{color:#ffb4ae;font-size:13px;background:#2a1413;border:1px solid #5a2724;border-radius:10px;padding:9px 12px}
.srow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.srow .ib{border:1px solid var(--line2);background:var(--panel2);border-radius:7px;height:30px;cursor:pointer;color:var(--muted);padding:0}
.srow .ib:hover{color:var(--ink)}
.acts{display:flex;gap:8px;align-items:center}
.acts .sp{flex:1}
.foot{color:var(--dim);font-size:12px;margin-top:22px;text-align:center}
@media(max-width:560px){.f2{grid-template-columns:1fr}.srow{grid-template-columns:70px 1fr 118px 26px 26px 26px}}
@media (prefers-reduced-motion:no-preference){
  .card,.prow{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
  .card:nth-child(2),.prow:nth-child(2){animation-delay:.05s}
  .card:nth-child(3),.prow:nth-child(3){animation-delay:.1s}
  .card:nth-child(4),.prow:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
  <p class="foot">Data tersimpan di browser ini. Klik Ekspor sesekali buat cadangan.</p>
</div>

<dialog id="dlg"></dialog>
<input type="file" id="imp" accept=".json,application/json" hidden>

<script>
(()=>{
'use strict';
const KEY='jejak.v1', DAY=86400000;
const BULAN=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_FULL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const COLORS=['#ff7a45','#4da3ff','#3ecf8e','#b983ff','#f0b429','#ff6b9d','#2ec4c9','#9aa3b2'];
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const ZOOM={minggu:44,bulan:22,kuartal:9};
const ROW=124;
const TPL={
  'Umum (ide sampai selesai)':['Ide & konsep','Perancangan','Pembuatan','Pengujian','Selesai'],
  'Tugas / laporan':['Outline','Draft','Revisi','Finalisasi','Dikumpulkan'],
  'Lomba / hackathon':['Daftar','Ide & proposal','Pembuatan','Submit','Pengumuman'],
  'Kosong':['Tahap 1','Tahap 2','Tahap 3']
};
const CHECK='<svg viewBox="0 0 16 16" width="13" height="13"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const diff=(a,b)=>Math.round((a-b)/DAY);
const fmtShort=d=>`${d.getDate()} ${BULAN[d.getMonth()]}`;
const fmtTime=s=>{const d=new Date(s);return `${d.getDate()} ${BULAN[d.getMonth()]} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nowIso=()=>new Date().toISOString();
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;

/* ---------- state ---------- */
const defUi=()=>({view:'roadmap',filter:'aktif',zoom:'bulan',month:'semua',hideDone:true,tmode:'minggu'});
function demo(){
  const t=today(), d=n=>iso(addDays(t,n)), ago=n=>new Date(Date.now()-n*DAY).toISOString();
  const mk=(name,color,start,rows,done,note,upd,log)=>({
    id:uid(),name,color,start:d(start),demo:true,note,updatedAt:ago(upd),
    stages:rows.map(([n,due],k)=>({id:uid(),name:n,due:d(due),done:k<done})),
    log:log.map(([ag,x])=>({t:ago(ag),x}))
  });
  return [
    mk('Contoh: Aplikasi kampus','#ff7a45',-24,[['Ide & konsep',-18],['Perancangan',-10],['Pembuatan',6],['Pengujian',14],['Selesai',18]],2,'Lagi ngerjain fitur inti',1,[[1,'Selesai: Perancangan'],[10,'Selesai: Ide & konsep'],[24,'Proyek dibuat']]),
    mk('Contoh: Laporan praktikum','#4da3ff',-9,[['Outline',-6],['Draft',-2],['Revisi',3],['Finalisasi',6],['Dikumpulkan',7]],1,'Draft belum kelar',5,[[5,'Selesai: Outline'],[9,'Proyek dibuat']]),
    mk('Contoh: Lomba hackathon','#3ecf8e',-3,[['Daftar',2],['Ide & proposal',9],['Pembuatan',21],['Submit',28],['Pengumuman',40]],0,'',0,[[3,'Proyek dibuat']]),
    mk('Contoh: Tugas yang sudah beres','#b983ff',-30,[['Outline',-26],['Draft',-20],['Revisi',-14],['Dikumpulkan',-9]],4,'',9,[[9,'Proyek selesai'],[14,'Selesai: Revisi'],[30,'Proyek dibuat']])
  ];
}
let S=load(), tAnchor=today(), tlScroll=null, draft=null, isNew=false;
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r); if(o&&Array.isArray(o.projects)) return {projects:o.projects,ui:Object.assign(defUi(),o.ui||{})};}
  }catch(e){}
  return {projects:demo(),ui:defUi()};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- derived ---------- */
function info(p){
  const t=today(), total=p.stages.length, done=p.stages.filter(s=>s.done).length;
  const cur=p.stages.findIndex(s=>!s.done);
  const finished=total>0&&cur===-1;
  const end=total?parse(p.stages[total-1].due):parse(p.start);
  const curDue=cur>=0?parse(p.stages[cur].due):null;
  const late=cur>=0&&curDue<t;
  const stale=finished?0:Math.floor((Date.now()-new Date(p.updatedAt))/DAY);
  return {total,done,cur,finished,end,curDue,late,lateDays:late?diff(t,curDue):0,stale,pct:total?Math.round(done/total*100):0};
}
function rel(d){
  const n=diff(d,today());
  if(n===0) return 'hari ini'; if(n===1) return 'besok'; if(n>1) return `${n} hari lagi`;
  return `telat ${-n} hari`;
}
function touch(p,text){
  p.updatedAt=nowIso();
  if(text){p.log=p.log||[];p.log.unshift({t:nowIso(),x:text});p.log=p.log.slice(0,40);}
}
function advance(id){
  const p=S.projects.find(x=>x.id===id); if(!p) return;
  const i=info(p); if(i.cur<0) return;
  p.stages[i.cur].done=true;
  touch(p,i.cur===p.stages.length-1?'Proyek selesai':`Selesai: ${p.stages[i.cur].name}`);
  save(); render();
}
function back(id){
  const p=S.projects.find(x=>x.id===id); if(!p) return;
  let k=-1; p.stages.forEach((s,j)=>{if(s.done)k=j;});
  if(k<0) return;
  p.stages[k].done=false; touch(p,`Dibuka lagi: ${p.stages[k].name}`); save(); render();
}
function gotoStage(id,k){
  const p=S.projects.find(x=>x.id===id); if(!p) return;
  if(info(p).cur===k) return;
  p.stages.forEach((s,j)=>{s.done=j<k});
  touch(p,`Pindah ke tahap: ${p.stages[k].name}`); save(); render();
}

/* ---------- render: shared ---------- */
function stats(){
  const act=S.projects.filter(p=>!info(p).finished), t=today();
  const late=act.filter(p=>info(p).late).length;
  const stale=act.filter(p=>info(p).stale>=3).length;
  let dl=0; act.forEach(p=>p.stages.forEach(s=>{if(!s.done){const n=diff(parse(s.due),t); if(n>=0&&n<=7) dl++;}}));
  return `<div class="stats">
    <div class="stat"><b>${act.length}</b><span>proyek aktif</span></div>
    <div class="stat ${late?'bad':''}"><b>${late}</b><span>telat dari tenggat tahap</span></div>
    <div class="stat ${stale?'warn':''}"><b>${stale}</b><span>belum disentuh 3 hari lebih</span></div>
    <div class="stat"><b>${dl}</b><span>tenggat tahap dalam 7 hari</span></div></div>`;
}
function banner(){
  if(!S.projects.some(p=>p.demo)) return '';
  return `<div class="banner"><span>Ini data contoh biar kelihatan bentuknya. Klik proyek buat edit, atau hapus semuanya kalau udah paham.</span><button class="btn sm" data-act="rmdemo">Hapus semua contoh</button></div>`;
}
function header(){
  const v=S.ui.view;
  return `<div class="top">
    <div class="brand"><h1><i></i>Jejak</h1><p>sampai mana sih aku?</p></div>
    <div class="seg2" role="tablist">
      <button class="${v==='roadmap'?'on':''}" data-act="view" data-v="roadmap">Roadmap</button>
      <button class="${v==='daftar'?'on':''}" data-act="view" data-v="daftar">Daftar</button>
      <button class="${v==='tugas'?'on':''}" data-act="view" data-v="tugas">Tugas</button>
    </div>
    <button class="btn ghost sm" data-act="export">Ekspor</button>
    <button class="btn ghost sm" data-act="import">Impor</button>
    <button class="btn pri" data-act="new">+ Proyek</button></div>`;
}
function statusChips(p,i){
  let c='';
  if(i.finished) c+=`<span class="pill ok">selesai</span>`;
  else{
    if(i.late) c+=`<span class="pill bad">telat ${i.lateDays} hari</span>`;
    else if(i.curDue&&diff(i.curDue,today())<=3) c+=`<span class="pill warn">tenggat ${rel(i.curDue)}</span>`;
    if(i.stale>=3) c+=`<span class="pill ${i.stale>=7?'bad':'warn'}">${i.stale} hari tanpa update</span>`;
  }
  return c;
}

/* ---------- render: roadmap ---------- */
function roadmap(){
  const t=today();
  const monthSet=new Set([mkey(t)]);
  S.projects.forEach(p=>{
    let c=parse(p.start); const e=info(p).end; c=new Date(c.getFullYear(),c.getMonth(),1);
    while(c<=e){monthSet.add(mkey(c)); c=new Date(c.getFullYear(),c.getMonth()+1,1);}
  });
  const months=[...monthSet].sort();
  if(S.ui.month!=='semua'&&!months.includes(S.ui.month)) S.ui.month='semua';

  let list=S.projects.filter(p=>!(S.ui.hideDone&&info(p).finished));
  let rs,re;
  if(S.ui.month!=='semua'){
    const [y,m]=S.ui.month.split('-').map(Number);
    rs=new Date(y,m-1,1); re=new Date(y,m,0);
    list=list.filter(p=>parse(p.start)<=re&&info(p).end>=rs);
  }else{
    let mn=addDays(t,-10), mx=addDays(t,40);
    list.forEach(p=>{const s=parse(p.start),e=info(p).end; if(s<mn)mn=s; if(e>mx)mx=e;});
    rs=addDays(mn,-3); re=addDays(mx,5);
  }
  const days=diff(re,rs)+1;
  let dw=ZOOM[S.ui.zoom]||22;
  if(S.ui.month!=='semua'){
    const avail=Math.max(320,($('#app').clientWidth||900)-8);
    dw=Math.max(dw,Math.floor(avail/days));
  }
  const W=days*dw;
  const X=d=>diff(d,rs)*dw;
  const inf=new Map(list.map(p=>[p.id,info(p)]));

  const controls=`<div class="bar">
    <div class="seg2">${['minggu','bulan','kuartal'].map(z=>`<button class="${S.ui.zoom===z?'on':''}" data-act="zoom" data-z="${z}">${z[0].toUpperCase()+z.slice(1)}</button>`).join('')}</div>
    <label>Bulan
      <select data-ch="month"><option value="semua">Semua</option>${months.map(m=>{const [y,mm]=m.split('-').map(Number);return `<option value="${m}" ${S.ui.month===m?'selected':''}>${BULAN_FULL[mm-1]} ${y}</option>`}).join('')}</select></label>
    <label><input type="checkbox" data-ch="hide" ${S.ui.hideDone?'checked':''}> sembunyikan yang selesai</label>
    <span class="sp"></span>
    <button class="btn sm" data-act="today">Ke hari ini</button></div>`;

  if(!list.length){
    return controls+`<div class="empty">${S.projects.length?'Tidak ada proyek di rentang ini.':'Belum ada proyek. Klik “+ Proyek” buat mulai.'}</div>`;
  }

  // header + overlay
  let mh='',wl='',dens='',grid='';
  let cur=new Date(rs), first=true;
  while(cur<=re){
    const mEnd=new Date(cur.getFullYear(),cur.getMonth()+1,0), segEnd=mEnd<re?mEnd:re;
    const lbl=BULAN[cur.getMonth()].toUpperCase()+((first||cur.getMonth()===0)?` ${cur.getFullYear()}`:'');
    mh+=`<div class="ml" style="left:${X(cur)}px;width:${(diff(segEnd,cur)+1)*dw}px"><span>${lbl}</span></div>`;
    grid+=`<div class="gl m" style="left:${X(cur)}px"></div>`;
    first=false; cur=addDays(segEnd,1);
  }
  const dl={};
  list.forEach(p=>p.stages.forEach(s=>{if(!s.done) dl[s.due]=(dl[s.due]||0)+1;}));
  const spans=list.filter(p=>!inf.get(p.id).finished).map(p=>[parse(p.start),inf.get(p.id).end]);
  let maxN=1; const cnt=[];
  for(let k=0;k<days;k++){const d=addDays(rs,k); const n=spans.filter(([a,b])=>a<=d&&b>=d).length; cnt.push(n); if(n>maxN)maxN=n;}
  for(let k=0;k<days;k++){
    const d=addDays(rs,k), x=k*dw, dow=d.getDay();
    if(dow===1){
      wl+=`<div class="wl" style="left:${x}px">${d.getDate()}</div>`;
      if(d.getDate()!==1) grid+=`<div class="gl" style="left:${x}px"></div>`;
    }
    if(dow===0||dow===6) grid+=`<div class="wk" style="left:${x}px;width:${dw}px"></div>`;
    const n=cnt[k], c=dl[iso(d)]||0;
    if(n||c>=2) dens+=`<div class="dn" style="left:${x}px;width:${dw}px;--p:${Math.round(n/maxN*55)}%" title="${fmtShort(d)}: ${n} proyek aktif${c?`, ${c} tenggat tahap`:''}">${c>=2?'<i>!</i>':''}</div>`;
  }
  const tx=X(t)+dw/2;
  const hwBg=dw>=9?`background-image:linear-gradient(to right,#303036 1px,transparent 1px);background-size:${dw}px 5px;`:'';

  const rows=list.map(p=>{
    const i=inf.get(p.id), c=p.color||COLORS[0];
    const bs=parse(p.start), bx=X(bs), bw=Math.max(dw,(diff(i.end,bs)+1)*dw);
    // fill
    let fillW=0;
    if(i.finished) fillW=bw;
    else{
      let lastDone=-1; p.stages.forEach((s,k)=>{if(s.done) lastDone=k;});
      if(lastDone>=0) fillW=Math.min(bw,(diff(parse(p.stages[lastDone].due),bs)+1)*dw);
    }
    let lateEl='';
    if(i.late){
      const lx=X(addDays(i.curDue,1)), lw=Math.max(dw,(diff(t,i.curDue))*dw+dw/2);
      lateEl=`<div class="over" style="left:${lx}px;width:${lw}px" title="Lewat tenggat ${i.lateDays} hari"></div>`;
    }
    let ms='',lbs='',tier=[-1e9,-1e9];
    p.stages.forEach((s,k)=>{
      const due=parse(s.due), x=X(due)+dw/2;
      if(x<-6||x>W+6) return;
      const st=s.done?'done':(k===i.cur?(i.late?'cur late':'cur'):'todo');
      const tip=`${s.name} · ${fmtShort(due)}${s.done?' · selesai':''}`;
      ms+=`<div class="ms ${st}" style="left:${x}px" title="${esc(tip)}" data-act="edit" data-id="${p.id}"></div>`;
      const w=s.name.length*6.6+12, a=x-w/2, b=x+w/2;
      let tr=-1;
      if(tier[0]<a) tr=0; else if(tier[1]<a) tr=1;
      if(tr>=0){tier[tr]=b; lbs+=`<div class="lb ${st}" style="left:${x}px;top:${84+tr*17}px">${esc(s.name)}</div>`;}
    });
    const metaTxt=i.finished?`${i.total}/${i.total}`:`${i.done}/${i.total} · ${esc(p.stages[i.cur]?.name||'')}`;
    return `<div class="prow" style="--c:${c}">
      <div class="ptrack" style="left:${bx}px;width:${Math.max(bw,780)}px">
        <div class="pname ${i.finished?'fin':''}"><span class="ico"></span><span class="nm" data-act="edit" data-id="${p.id}">${esc(p.name)}</span>
          <span class="meta">${metaTxt}</span>${statusChips(p,i)}
          ${i.finished?'':`<button class="go" data-act="adv" data-id="${p.id}" title="Tahap ini beres, lanjut">▸</button>`}</div></div>
      <div class="pbar ${i.finished?'fin':''}" style="left:${bx}px;width:${bw}px" data-act="edit" data-id="${p.id}"><div class="fill" style="width:${fillW}px"></div></div>
      ${lateEl}${ms}${lbs}</div>`;
  }).join('');

  return controls+`<div class="tl" data-today="${tx}" data-first="${Math.min(...list.filter(p=>!inf.get(p.id).finished).map(p=>X(parse(p.start))),1e9)}"><div class="tlin" style="width:${W}px">
    <div class="hdr"><div class="hm">${mh}</div><div class="hw" style="${hwBg}">${wl}</div><div class="hd">${dens}</div>
      ${S.ui.month==='semua'||(t>=rs&&t<=re)?`<div class="todayl" style="left:${tx}px"></div>`:''}</div>
    <div class="body"><div class="ovl">${grid}</div>${rows}
      ${(t>=rs&&t<=re)?`<div class="todayl" style="left:${tx}px"></div>`:''}</div></div></div>
    <div class="legend">
      <span><i class="lg-d f"></i>tahap selesai (dicoret)</span><span><i class="lg-d c"></i>tahap sekarang</span>
      <span><i class="lg-d r"></i>tahap telat</span><span><i class="lg-l"></i>lewat tenggat</span>
      <span>strip bawah header: makin terang makin banyak proyek aktif, tanda ! artinya 2 tenggat atau lebih jatuh di hari yang sama</span></div>`;
}

/* ---------- render: tugas ---------- */
function taskItem(t,t0){
  const {p,s,k,i,due}=t, c=p.color||COLORS[0], n=diff(due,t0);
  const chk=t.isCur
    ?`<button class="chk" data-act="tdone" data-id="${p.id}" title="Tandai beres">${CHECK}</button>`
    :`<span class="chk off" title="Selesaikan tahap sebelumnya dulu"></span>`;
  const pill=n<0?`<span class="pill bad">telat ${-n} hari</span>`:'';
  return `<li class="task" style="--c:${c}">${chk}
    <div class="tb" data-act="edit" data-id="${p.id}"><span class="tn">${esc(s.name)}</span>
      <span class="tp"><b><i></i>${esc(p.name)}</b><em>tahap ${k+1}/${i.total}</em>${pill}</span></div></li>`;
}
function tugas(){
  const t0=today(), mode=S.ui.tmode==='hari'?'hari':'minggu';
  const a=new Date(tAnchor.getFullYear(),tAnchor.getMonth(),tAnchor.getDate());
  const rs=mode==='hari'?a:addDays(a,-((a.getDay()+6)%7));
  const re=mode==='hari'?a:addDays(rs,6);
  const all=[];
  S.projects.forEach(p=>{const i=info(p); p.stages.forEach((s,k)=>{if(!s.done) all.push({p,s,k,i,due:parse(s.due),isCur:k===i.cur});});});
  const lateEdge=rs<t0?rs:t0;
  const late=all.filter(x=>x.due<lateEdge).sort((x,y)=>x.due-y.due);
  const label=mode==='hari'
    ?`${HARI[a.getDay()]}, ${a.getDate()} ${BULAN[a.getMonth()]} ${a.getFullYear()}`
    :`${fmtShort(rs)} – ${fmtShort(re)} ${re.getFullYear()}`;
  const unit=mode==='hari'?'hari':'minggu';
  const controls=`<div class="bar">
    <div class="seg2">${[['hari','Hari'],['minggu','Minggu']].map(([k,l])=>`<button class="${mode===k?'on':''}" data-act="tmode" data-m="${k}">${l}</button>`).join('')}</div>
    <div class="tnav">
      <button class="btn sm" data-act="tnav" data-n="-1" title="${unit} sebelumnya" aria-label="${unit} sebelumnya">◂</button>
      <span class="tl2">${label}</span>
      <button class="btn sm" data-act="tnav" data-n="1" title="${unit} berikutnya" aria-label="${unit} berikutnya">▸</button></div>
    <button class="btn sm" data-act="ttoday">Hari ini</button>
    <label>Loncat ke <input type="date" data-ch="tdate" value="${iso(a)}"></label></div>`;
  const lateCard=late.length?`<section class="dcard late"><div class="dh"><h3>Telat</h3><span class="dc">${late.length} tugas</span></div>
    <ul class="tasks">${late.map(x=>taskItem(x,t0)).join('')}</ul></section>`:'';
  const dayCard=d=>{
    const items=all.filter(x=>diff(x.due,d)===0);
    const isT=diff(d,t0)===0;
    const head=mode==='hari'
      ?`<h3>${isT?'Hari ini':HARI[d.getDay()]}<small>${fmtShort(d)}</small></h3>`
      :`<h3>${HARI[d.getDay()]}<small>${fmtShort(d)}${isT?' · hari ini':''}</small></h3>`;
    const body=items.length?`<ul class="tasks">${items.map(x=>taskItem(x,t0)).join('')}</ul>`
      :`<p class="tnone">${mode==='hari'?'Nggak ada tugas di hari ini.':'Kosong'}</p>`;
    return `<section class="dcard ${isT?'today':''} ${items.length?'':'empty2'}"><div class="dh">${head}<span class="dc">${items.length?items.length+' tugas':''}</span></div>${body}</section>`;
  };
  const cards=[];
  for(let d=new Date(rs);d<=re;d=addDays(d,1)) cards.push(dayCard(d));
  return controls+lateCard+`<div class="days ${mode==='hari'?'one':''}">${cards.join('')}</div>`;
}

/* ---------- render: daftar ---------- */
function daftar(){
  const f=S.ui.filter;
  let list=S.projects.map(p=>({p,i:info(p)}));
  if(f==='aktif') list=list.filter(x=>!x.i.finished);
  if(f==='selesai') list=list.filter(x=>x.i.finished);
  list.sort((a,b)=>{
    if(a.i.finished!==b.i.finished) return a.i.finished?1:-1;
    if(a.i.finished) return new Date(b.p.updatedAt)-new Date(a.p.updatedAt);
    return a.i.curDue-b.i.curDue;
  });
  const controls=`<div class="bar"><div class="seg2">${[['aktif','Aktif'],['selesai','Selesai'],['semua','Semua']].map(([k,l])=>`<button class="${f===k?'on':''}" data-act="filter" data-f="${k}">${l}</button>`).join('')}</div></div>`;
  if(!list.length) return controls+`<div class="empty">${S.projects.length?'Tidak ada proyek di filter ini.':'Belum ada proyek. Klik “+ Proyek” buat mulai.'}</div>`;
  return controls+`<div class="cards">${list.map(({p,i})=>card(p,i)).join('')}</div>`;
}
function card(p,i){
  const c=p.color||COLORS[0];
  const steps=p.stages.map((s,k)=>{
    const st=s.done?'done':(k===i.cur?(i.late?'cur late':'cur'):'todo');
    return `<li class="step ${st}" data-act="goto" data-id="${p.id}" data-k="${k}" title="Klik buat jadikan ini tahap sekarang">
      <span class="dot">${s.done?CHECK:k+1}</span><span class="sname">${esc(s.name)}</span><span class="sdue">${fmtShort(parse(s.due))}</span></li>`;
  }).join('');
  const goLabel=i.cur===p.stages.length-1?'Beres, proyek selesai':'Beres, lanjut ▸';
  const nowLine=i.finished?`<p class="now">Semua tahap sudah selesai.</p>`
    :`<p class="now">Sekarang: <b>${esc(p.stages[i.cur].name)}</b>, tenggat ${fmtShort(i.curDue)} (${rel(i.curDue)})</p>`;
  const log=(p.log||[]).slice(0,8).map(l=>`<li><span>${fmtTime(l.t)}</span>${esc(l.x)}</li>`).join('');
  return `<article class="card ${i.finished?'fin':''}" style="--c:${c}">
    <div class="chead"><div><h3 data-act="edit" data-id="${p.id}">${esc(p.name)}</h3>
      <div class="csub">${fmtShort(parse(p.start))} sampai ${fmtShort(i.end)}</div></div>
      <div class="cnt">${i.done}/${i.total}<small>${i.pct}%</small></div></div>
    <div class="prog"><div style="width:${i.pct}%"></div></div>
    <div class="chips">${statusChips(p,i)}</div>
    <ol class="steps">${steps}</ol>
    ${nowLine}
    <input class="note" type="text" data-note="${p.id}" placeholder="Lagi ngapain / langkah berikutnya" value="${esc(p.note||'')}">
    <div class="cfoot">
      ${i.finished?'':`<button class="gobtn" data-act="adv" data-id="${p.id}">${goLabel}</button>`}
      <button class="btn sm" data-act="back" data-id="${p.id}" ${i.done?'':'disabled'}>◂ Mundur</button>
      <span class="sp"></span>
      <button class="btn sm ghost" data-act="edit" data-id="${p.id}">Edit</button></div>
    ${log?`<details data-did="${p.id}" ${openLogs.has(p.id)?'open':''}><summary>Riwayat (${(p.log||[]).length})</summary><ul>${log}</ul></details>`:''}
  </article>`;
}
const openLogs=new Set();
document.addEventListener('toggle',e=>{
  const d=e.target; if(!d.dataset||!d.dataset.did) return;
  d.open?openLogs.add(d.dataset.did):openLogs.delete(d.dataset.did);
},true);

/* ---------- main render ---------- */
function render(){
  const old=$('.tl'); if(old) tlScroll=old.scrollLeft;
  $('#app').innerHTML=header()+banner()+stats()+(S.ui.view==='roadmap'?roadmap():S.ui.view==='tugas'?tugas():daftar());
  const sc=$('.tl');
  if(sc){
    if(tlScroll!=null) sc.scrollLeft=tlScroll;
    else{
      const tx=+sc.dataset.today||0, fx=+sc.dataset.first, vis=sc.clientWidth;
      const target=tx-vis*0.3;
      sc.scrollLeft=Math.max(0,(fx<1e8&&tx-(fx-24)<vis*0.7)?fx-24:target);
    }
  }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.closest('dialog')) return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='adv') advance(id);
  else if(a==='back') back(id);
  else if(a==='goto') gotoStage(id,+b.dataset.k);
  else if(a==='edit') openEdit(id);
  else if(a==='new') openEdit(null);
  else if(a==='view'){S.ui.view=b.dataset.v; tlScroll=null; save(); render();}
  else if(a==='filter'){S.ui.filter=b.dataset.f; save(); render();}
  else if(a==='zoom'){S.ui.zoom=b.dataset.z; tlScroll=null; save(); render();}
  else if(a==='today'){tlScroll=null; render();}
  else if(a==='tdone') advance(id);
  else if(a==='tmode'){S.ui.tmode=b.dataset.m; save(); render();}
  else if(a==='tnav'){tAnchor=addDays(tAnchor,+b.dataset.n*(S.ui.tmode==='hari'?1:7)); render();}
  else if(a==='ttoday'){tAnchor=today(); render();}
  else if(a==='rmdemo'){S.projects=S.projects.filter(p=>!p.demo); save(); render();}
  else if(a==='export') doExport();
  else if(a==='import') $('#imp').click();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.ch==='month'){S.ui.month=t.value; tlScroll=null; save(); render();}
  else if(t.dataset&&t.dataset.ch==='tdate'){if(t.value){tAnchor=parse(t.value); render();}}
  else if(t.dataset&&t.dataset.ch==='hide'){S.ui.hideDone=t.checked; save(); render();}
  else if(t.dataset&&t.dataset.note){
    const p=S.projects.find(x=>x.id===t.dataset.note); if(!p) return;
    p.note=t.value.trim(); p.updatedAt=nowIso(); save();
  }
});

/* ---------- export / import ---------- */
function doExport(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`jejak-${iso(today())}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.projects)) throw new Error('format');
      if(!confirm(`Ganti semua data sekarang dengan ${o.projects.length} proyek dari file ini?`)) return;
      S={projects:o.projects,ui:Object.assign(defUi(),o.ui||{})}; tlScroll=null; save(); render();
    }catch(err){alert('File ini bukan cadangan Jejak yang valid.');}
  };
  r.readAsText(f); e.target.value='';
});

/* ---------- edit dialog ---------- */
const dlg=$('#dlg');
function distribute(d,endIso){
  const n=d.stages.length; if(!n) return;
  const s=parse(d.start), e=parse(endIso||d.start);
  const total=Math.max(1,diff(e,s)+1);
  d.stages.forEach((st,k)=>{st.due=iso(addDays(s,Math.max(0,Math.round(total*(k+1)/n)-1)));});
}
function newDraft(){
  const t=today(), names=TPL['Umum (ide sampai selesai)'];
  const d={id:uid(),name:'',color:COLORS[S.projects.length%COLORS.length],start:iso(t),note:'',updatedAt:nowIso(),log:[],
    stages:names.map(n=>({id:uid(),name:n,due:'',done:false}))};
  distribute(d,iso(addDays(t,35)));
  return d;
}
function openEdit(id){
  const p=id?S.projects.find(x=>x.id===id):null;
  isNew=!p; draft=p?JSON.parse(JSON.stringify(p)):newDraft();
  dlgRender(); dlg.showModal();
  if(isNew) setTimeout(()=>{const n=$('#f-name'); if(n) n.focus();},30);
}
function stageRows(){
  return draft.stages.map((s,k)=>`<div class="srow">
    <label class="ck"><input type="checkbox" data-k="${k}" data-f="done" ${s.done?'checked':''}><span>Selesai</span></label>
    <input type="text" data-k="${k}" data-f="name" value="${esc(s.name)}" placeholder="Nama tahap">
    <input type="date" data-k="${k}" data-f="due" value="${esc(s.due)}">
    <button type="button" class="ib" data-d="up" data-k="${k}" ${k?'':'disabled'} title="Naik">↑</button>
    <button type="button" class="ib" data-d="down" data-k="${k}" ${k<draft.stages.length-1?'':'disabled'} title="Turun">↓</button>
    <button type="button" class="ib" data-d="rm" data-k="${k}" title="Hapus tahap">✕</button></div>`).join('');
}
function lastDue(){return draft.stages.length?draft.stages[draft.stages.length-1].due:draft.start;}
function dlgRender(){
  dlg.innerHTML=`<form id="f" autocomplete="off">
    <h2>${isNew?'Proyek baru':'Edit proyek'}</h2>
    <label class="fl">Nama proyek<input type="text" id="f-name" value="${esc(draft.name)}" placeholder="Misal: Aplikasi Loak"></label>
    <div class="f2">
      <label class="fl">Mulai<input type="date" id="f-start" value="${esc(draft.start)}"></label>
      <label class="fl">Tenggat akhir<input type="date" id="f-end" value="${esc(lastDue())}"></label></div>
    <div class="fl">Warna<div class="sw">${COLORS.map(c=>`<label><input type="radio" name="col" value="${c}" ${draft.color===c?'checked':''}><span style="--c:${c}"></span></label>`).join('')}</div></div>
    ${isNew?`<label class="fl">Template tahap<select id="f-tpl">${Object.keys(TPL).map(k=>`<option>${esc(k)}</option>`).join('')}</select></label>`:''}
    <div><div class="sh"><span>Tahap (titik di timeline = tanggal tenggat tahap)</span><button type="button" class="btn sm" data-d="spread">Ratakan tanggal</button></div>
      <div class="srows" id="stg" style="margin-top:8px">${stageRows()}</div>
      <button type="button" class="btn sm" data-d="add" style="margin-top:8px">+ Tahap</button></div>
    <div id="warn" class="warnbox" hidden></div>
    <div class="acts">
      ${isNew?'':'<button type="button" class="btn danger" data-d="del">Hapus proyek</button>'}
      <span class="sp"></span>
      <button type="button" class="btn" data-d="cancel">Batal</button>
      <button type="submit" class="btn pri">Simpan</button></div></form>`;
}
function refreshStages(){$('#stg').innerHTML=stageRows(); $('#f-end').value=lastDue(); clearWarn();}
function clearWarn(){const w=$('#warn'); if(w) w.hidden=true; document.querySelectorAll('#stg input.bad').forEach(x=>x.classList.remove('bad'));}
dlg.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-name') draft.name=t.value;
  else if(t.id==='f-start') draft.start=t.value||draft.start;
  else if(t.dataset.f==='name') draft.stages[+t.dataset.k].name=t.value;
  else if(t.dataset.f==='due'){draft.stages[+t.dataset.k].due=t.value; $('#f-end').value=lastDue(); clearWarn();}
  else if(t.name==='col') draft.color=t.value;
});
dlg.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.f==='done') draft.stages[+t.dataset.k].done=t.checked;
  else if(t.id==='f-end'&&draft.stages.length){draft.stages[draft.stages.length-1].due=t.value||draft.stages[draft.stages.length-1].due; refreshStages();}
  else if(t.id==='f-tpl'){
    const names=TPL[t.value]; if(!names) return;
    draft.stages=names.map(n=>({id:uid(),name:n,due:'',done:false}));
    distribute(draft,$('#f-end').value||iso(addDays(parse(draft.start),35))); refreshStages();
  }
});
dlg.addEventListener('click',e=>{
  const b=e.target.closest('[data-d]'); if(!b) return;
  const a=b.dataset.d,k=+b.dataset.k,st=draft.stages;
  if(a==='cancel') dlg.close();
  else if(a==='add'){
    const last=st.length?parse(st[st.length-1].due||draft.start):parse(draft.start);
    st.push({id:uid(),name:`Tahap ${st.length+1}`,due:iso(addDays(last,7)),done:false}); refreshStages();
  }
  else if(a==='rm'){st.splice(k,1); refreshStages();}
  else if(a==='up'&&k>0){[st[k-1],st[k]]=[st[k],st[k-1]]; refreshStages();}
  else if(a==='down'&&k<st.length-1){[st[k+1],st[k]]=[st[k],st[k+1]]; refreshStages();}
  else if(a==='spread'){distribute(draft,$('#f-end').value||lastDue()); refreshStages();}
  else if(a==='del'){
    if(confirm(`Hapus proyek “${draft.name||'tanpa nama'}”? Ini nggak bisa dibatalkan.`)){
      S.projects=S.projects.filter(p=>p.id!==draft.id); save(); dlg.close(); render();
    }
  }
});
dlg.addEventListener('submit',e=>{
  e.preventDefault();
  draft.name=draft.name.trim();
  if(!draft.name){$('#f-name').focus(); $('#f-name').style.borderColor='var(--bad)'; return;}
  if(!draft.stages.length){alert('Tambahin minimal satu tahap dulu.'); return;}
  draft.stages.forEach((s,k)=>{s.name=(s.name||'').trim()||`Tahap ${k+1}`; if(!s.due) s.due=draft.start;});
  const bad=[];
  draft.stages.forEach((s,k)=>{
    const before=k?draft.stages[k-1]:null;
    if(before&&s.due<before.due) bad.push(`“${before.name}” (${fmtShort(parse(before.due))}) lebih akhir dari “${s.name}” (${fmtShort(parse(s.due))})`);
    else if(!before&&s.due<draft.start) bad.push(`“${s.name}” (${fmtShort(parse(s.due))}) lebih awal dari tanggal mulai (${fmtShort(parse(draft.start))})`);
    if((before&&s.due<before.due)||(!before&&s.due<draft.start)) s.__bad=true;
  });
  if(bad.length){
    const w=$('#warn'); w.hidden=false;
    w.textContent='Urutan tanggal belum pas, jadi belum disimpan. '+bad.join('; ')+'. Betulin tanggalnya, atau klik “Ratakan tanggal”.';
    document.querySelectorAll('#stg .srow').forEach((row,k)=>{const d=row.querySelector('[data-f=due]'); if(d) d.classList.toggle('bad',!!draft.stages[k].__bad);});
    draft.stages.forEach(s=>{delete s.__bad;});
    w.scrollIntoView({block:'nearest'});
    return;
  }
  const fu=draft.stages.findIndex(s=>!s.done);
  draft.stages.forEach((s,k)=>{s.done=fu===-1?true:k<fu;});
  if(isNew){
    delete draft.demo; draft.updatedAt=nowIso(); draft.log=[{t:nowIso(),x:'Proyek dibuat'}];
    S.projects.push(draft);
  }else{
    const idx=S.projects.findIndex(p=>p.id===draft.id); if(idx<0){dlg.close();return;}
    const o=S.projects[idx];
    const sig=x=>JSON.stringify([x.name,x.color,x.start,x.stages.map(s=>[s.name,s.due,s.done])]);
    if(sig(o)!==sig(draft)){delete draft.demo; touch(draft,'Proyek diedit');}
    S.projects[idx]=draft;
  }
  save(); dlg.close(); render();
});

render();
try{if(navigator.storage&&navigator.storage.persist) navigator.storage.persist();}catch(e){}
})();
</script>
</body>
</html>
